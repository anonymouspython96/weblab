<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Checker - Bootstrap Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-between">

    <header class="w-100 py-3 px-4 border-bottom border-secondary bg-dark bg-opacity-50 backdrop-blur">
        <div class="container d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <div class="bg-indigo bg-gradient p-2 rounded-3 text-white shadow" style="background-color: #6366f1;">
                    <i class="bi bi-file-earmark-diff fs-5"></i>
                </div>
                <h1 class="h5 fw-bold mb-0 text-white">String Checker</h1>
            </div>
            <span class="badge bg-secondary border border-secondary text-light">Bootstrap 5 Responsive</span>
        </div>
    </header>

    <main class="flex-grow-1 container py-4 py-md-5 d-flex flex-column gap-4">
        
        <!-- Options & Settings Card -->
        <div class="custom-card p-4 shadow-lg">
            <h2 class="text-secondary text-uppercase fs-6 fw-semibold mb-3">Opzioni di Confronto</h2>
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label class="d-flex align-items-center gap-3 p-3 rounded-3 bg-dark bg-opacity-50 border border-secondary border-opacity-25 cursor-pointer h-100">
                        <input type="checkbox" id="caseSensitive" checked class="form-check-input mt-0 fs-5">
                        <div>
                            <span class="d-block fw-medium text-light">Distingui Maiuscole (Case Sensitive)</span>
                            <span class="d-block text-secondary small">Tratta 'A' e 'a' come caratteri diversi</span>
                        </div>
                    </label>
                </div>
                <div class="col-12 col-md-6">
                    <label class="d-flex align-items-center gap-3 p-3 rounded-3 bg-dark bg-opacity-50 border border-secondary border-opacity-25 cursor-pointer h-100">
                        <input type="checkbox" id="trimSpaces" class="form-check-input mt-0 fs-5">
                        <div>
                            <span class="d-block fw-medium text-light">Ignora spazi esterni (Trim)</span>
                            <span class="d-block text-secondary small">Rimuove spazi all'inizio e alla fine</span>
                        </div>
                    </label>
                </div>
            </div>
        </div>

        <!-- Input Textareas Grid -->
        <div class="row g-4">
            <!-- String 1 -->
            <div class="col-12 col-md-6 d-flex flex-column gap-2">
                <div class="d-flex justify-content-between align-items-center px-1">
                    <label for="string1" class="form-label text-light mb-0 fw-medium">Prima Stringa</label>
                    <button onclick="clearInput('string1')" class="btn btn-link btn-sm text-secondary text-decoration-none p-0">Pulisci</button>
                </div>
                <textarea id="string1" rows="5" placeholder="Inserisci la prima stringa qui..." class="form-control shadow-inner resize-none"></textarea>
                <div class="d-flex justify-content-between text-secondary small px-1">
                    <span id="len1">Lunghezza: 0</span>
                    <span id="words1">Parole: 0</span>
                </div>
            </div>

            <!-- String 2 -->
            <div class="col-12 col-md-6 d-flex flex-column gap-2">
                <div class="d-flex justify-content-between align-items-center px-1">
                    <label for="string2" class="form-label text-light mb-0 fw-medium">Seconda Stringa</label>
                    <button onclick="clearInput('string2')" class="btn btn-link btn-sm text-secondary text-decoration-none p-0">Pulisci</button>
                </div>
                <textarea id="string2" rows="5" placeholder="Inserisci la seconda stringa qui..." class="form-control shadow-inner resize-none"></textarea>
                <div class="d-flex justify-content-between text-secondary small px-1">
                    <span id="len2">Lunghezza: 0</span>
                    <span id="words2">Parole: 0</span>
                </div>
            </div>
        </div>

        <div id="resultCard" class="custom-card p-4 shadow-lg transition-all">
            <div class="d-flex flex-column flex-sm-row align-items-center justify-content-between gap-4">
                <div class="d-flex align-items-center gap-3 w-100 text-center text-sm-start flex-column flex-sm-row">
                    <div id="resultIcon" class="p-3 rounded-3 bg-secondary text-light d-flex align-items-center justify-content-center shadow" style="min-width: 60px; min-height: 60px;">
                        <i class="bi bi-info-circle fs-3"></i>
                    </div>
                    <div>
                        <h3 id="resultTitle" class="h6 fw-bold text-light mb-1">In attesa di input...</h3>
                        <p id="resultSubtitle" class="text-secondary small mb-0">Inserisci del testo in entrambe le caselle per iniziare il confronto.</p>
                    </div>
                </div>
                <div class="d-flex gap-2 w-100 w-sm-auto justify-content-center">
                    <button onclick="swapStrings()" class="btn btn-secondary px-3 py-2 text-light fw-medium d-flex align-items-center gap-2 flex-fill flex-sm-grow-0 justify-content-center">
                        <i class="bi bi-arrow-left-right"></i>
                        <span>Inverti</span>
                    </button>
                    <button onclick="copyComparison()" class="btn px-3 py-2 text-white fw-medium d-flex align-items-center gap-2 flex-fill flex-sm-grow-0 justify-content-center shadow" style="background-color: #6366f1;">
                        <i class="bi bi-clipboard"></i>
                        <span id="copyText">Copia Esito</span>
                    </button>
                </div>
            </div>
        </div>

    </main>

    <footer class="w-100 py-3 px-4 border-top border-secondary text-center text-secondary small bg-dark bg-opacity-50">
        String Checker &bull; Realizzato con Bootstrap 5 e JavaScript.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
